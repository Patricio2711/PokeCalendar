name: Build Android APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: cd android_app && flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueCalendar-Android
          path: android_app/build/apk/app-release.apk
